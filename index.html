<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alter Ego</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; font-family: sans-serif; background: #222; color: #fff; overflow: hidden; position: relative; }
    
  /* Panel Izquierdo: Contenedor Flexible */
  #avatar-container { 
    width: 35%; 
    height: 100vh; /* Ocupa siempre el 100% de la altura de la ventana */
    display: flex; 
    align-items: flex-end; 
    justify-content: center; 
    background: #111; 
    padding: 20px; 
    overflow: hidden; /* Evita scrollbars no deseados si el sprite es muy grande */
  }

  /* Sprite: Reajuste automático proporcional */
  #avatar-img { 
    width: 100%;
    height: 100%;
    max-width: 100%; 
    max-height: 80vh; 
    object-fit: contain; /* Garantiza que la imagen escale manteniendo su relación de aspecto original */
    object-position: bottom center; /* Mantiene la base del personaje siempre pegada abajo */
  }

    /* Panel Central: Chat */
    #chat-container { flex: 1; display: flex; flex-direction: column; border-left: 2px solid #333; }
    #chat-box { flex: 1; padding: 20px; padding-top: 60px; /* Espacio superior para no solapar con el botón ☰ */ overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; white-space: pre-wrap; }
    .user { background: #005c4b; align-self: flex-end; }
    .bot { background: #333; align-self: flex-start; }
    
    #input-container { padding: 15px; background: #1a1a1a; display: flex; gap: 10px; }
    #user-input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; }
    #send-btn { padding: 10px 20px; background: #1e491d; border: none; color: #fff; border-radius: 5px; cursor: pointer; }

    /* Botón flotante para abrir/cerrar el menú de chats en la esquina superior derecha */
    #toggle-sidebar-btn {
      position: fixed;
      top: 12px;
      right: 24px;
      background: #183323;
      border: 1px solid #28543a;
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
      z-index: 101;
      transition: background 0.2s;
    }

    #toggle-sidebar-btn:hover {
      background: #224731;
    }

    /* Barra Lateral Verde Oscuro Deslizante colocada a la derecha */
    #sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: 260px;
      height: 100vh;
      background-color: #112217; /* Verde oscuro */
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
      z-index: 100;
      box-shadow: -3px 0 12px rgba(0, 0, 0, 0.5);
    }

    /* Oculta la barra desplegándola hacia la derecha fuera de la pantalla */
    #sidebar.collapsed {
      transform: translateX(100%);
    }

    .sidebar-header {
      padding: 60px 15px 15px 15px; /* Margen superior para no tapar el botón ☰ */
    }

    .btn-new-chat {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #2d593e;
      background: #1b3826;
      color: #e0f2e9;
      cursor: pointer;
      text-align: left;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-new-chat:hover {
      background: #254d34;
    }

    /* Contenedor de la lista de conversaciones */
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    /* Elementos individuales de la lista */
    .chat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 5px;
      color: #c2e0cf;
      cursor: pointer;
      transition: background 0.2s;
    }

    .chat-item:hover {
      background-color: #1a3826;
    }

    .chat-item.active {
      background-color: #275237;
      color: #ffffff;
      font-weight: bold;
    }

    .chat-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }

    /* Botón de eliminar chat ('X') */
    .delete-chat-btn {
      background: transparent;
      border: none;
      color: #8dae99;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      visibility: hidden;
      transition: color 0.2s, background 0.2s;
    }

    .chat-item:hover .delete-chat-btn {
      visibility: visible;
    }

    .delete-chat-btn:hover {
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.15);
    }
  </style>
</head>
<body>

  <!-- Botón superior flotante a la derecha para desplegar u ocultar el menú -->
  <button id="toggle-sidebar-btn" title="Menú de chats">☰</button>

  <!-- Barra Lateral a la derecha (Por defecto arranca colapsada/oculta hacia la derecha) -->
  <div id="sidebar" class="sidebar collapsed">
    <div class="sidebar-header">
      <button id="new-chat-btn" class="btn-new-chat">+ Nuevo Chat</button>
    </div>
    <div id="chat-list" class="chat-list"></div>
  </div>

  <!-- Contenedor del Avatar/Sprite -->
  <div id="avatar-container">
    <img id="avatar-img" src="sprites/neutral.png" alt="Avatar">
  </div>

  <!-- Contenedor del Chat -->
  <div id="chat-container">
    <div id="chat-box"></div>
    <div id="input-container">
      <input type="text" id="user-input" placeholder="Escribe tu mensaje...">
      <button id="send-btn">Enviar</button>
    </div>
  </div>

  <script src="render.js"></script>
</body>
</html>
