<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alter Ego</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; font-family: sans-serif; background: #222; color: #fff; }
    
    /* Panel Izquierdo: Sprite */
    #avatar-container { width: 30%; display: flex; align-items: flex-end; justify-content: center; background: #111; padding: 10px; }
    #avatar-img { max-width: 100%; max-height: 90vh; object-fit: contain; }

    /* Panel Central: Chat */
    #chat-container { width: 50%; display: flex; flex-direction: column; border-left: 2px solid #444; border-right: 2px solid #444; }
    #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; white-space: pre-wrap; }
    .user { background: #005c4b; align-self: flex-end; }
    .bot { background: #333; align-self: flex-start; }
    
    #input-container { padding: 15px; background: #1a1a1a; display: flex; gap: 10px; }
    #user-input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; }
    #send-btn { padding: 10px 20px; background: #0084ff; border: none; color: #fff; border-radius: 5px; cursor: pointer; }

    /* Panel Derecho: Historial */
    #sidebar { width: 20%; padding: 15px; background: #181818; }
  </style>
</head>
<body>

  <div id="avatar-container">
    <img id="avatar-img" src="sprites/neutral.png" alt="Avatar">
  </div>

  <div id="chat-container">
    <div id="chat-box"></div>
    <div id="input-container">
      <input type="text" id="user-input" placeholder="Escribe tu mensaje...">
      <button id="send-btn">Enviar</button>
    </div>
  </div>

  <div id="sidebar">
    <h3>Conversaciones</h3>
    <select id="chat-history" style="width: 100%; margin-top: 10px; padding: 5px;">
      <option>Chat Actual</option>
    </select>
  </div>

    <script src="render.js"></script>
</body>
</html>
